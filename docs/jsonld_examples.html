      "acceptedAnswer": {"@type": "Answer", "text": "RFID identifies objects wirelessly using radio waves. A system consists of a reader and tags; tags are either active (battery-powered) or passive (powered by the reader's field)."}

      "@type": "Question",
      "name": "What is the difference between NFC and RFID?",
      "acceptedAnswer": {"@type": "Answer", "text": "NFC is a subset of high-frequency (13.56 MHz) RFID designed for short-range, secure data exchange. Unlike typical RFID, an NFC device can act as both a reader and a tag, enabling peer-to-peer communication."}

}
